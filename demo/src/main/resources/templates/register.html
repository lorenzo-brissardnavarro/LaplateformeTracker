<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page d'Inscription</title>
</head>
<body>
    
    <h1>Inscription</h1>
    <form th:action="@{/register}" th:object="${student}" method="post">
        <div>
            <label for="firstName">Prénom:</label>
            <input type="text" id="firstName" name="firstName" th:field="*{first_name}" />
        </div>
        <div>
            <label for="lastName">Nom:</label>
            <input type="text" id="lastName" name="lastName" th:field="*{last_name}" />
        </div>
        <div>
            <label for="age">Âge:</label>
            <input type="number" id="age" name="age" th:field="*{age}" />
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" th:field="*{email}" />
        </div>
        <div>
            <label for="password">Mot de passe:</label>
            <input type="password" id="password" name="password" th:field="*{password}" />
        </div>
        <button type="submit">S'inscrire</button>
    </form>

</body>
</html>
